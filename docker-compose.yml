services:
  # PostgreSQL 데이터베이스 (pgvector 포함: document_chunks.embedding 벡터 검색용)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ziggle-chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ziggle_chatbot}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ziggle-chatbot-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Database (Docker에서만 다른 값)
      DB_HOST: postgres # Docker 네트워크 내 서비스 이름
      NODE_ENV: production # Docker는 프로덕션 모드
      # 나머지는 .env 파일에서 가져옴
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ziggle_chatbot}
      DB_SSL: ${DB_SSL:-false}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN}
      # Infoteam IDP Configuration
      IDP_URL: ${IDP_URL}
      IDP_CLIENT_ID: ${IDP_CLIENT_ID}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}
      # Client Domain Configuration
      DOMAIN_NAME: ${DOMAIN_NAME}
      # MCP Configuration (optional)
      MCP_BASE_URL: ${MCP_BASE_URL:-}
      MCP_RESOURCE_API_URL: ${MCP_RESOURCE_API_URL:-}
      # GCS / PDF Processor
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCS_SERVICE_ACCOUNT_KEY_BASE64: ${GCS_SERVICE_ACCOUNT_KEY_BASE64:-}
      PDF_PROCESSOR_CONCURRENCY: ${PDF_PROCESSOR_CONCURRENCY:-1}
      PDF_PROCESSOR_CONTEXT_LENGTH: ${PDF_PROCESSOR_CONTEXT_LENGTH:-500}
      PDF_PROCESSOR_LLM_TIMEOUT: ${PDF_PROCESSOR_LLM_TIMEOUT:-120}
      PDF_PROCESSOR_PASS1_MAX_FAILURE_RATIO: ${PDF_PROCESSOR_PASS1_MAX_FAILURE_RATIO:-0.1}
      PDF_PROCESSOR_POLL_INTERVAL_MS: ${PDF_PROCESSOR_POLL_INTERVAL_MS:-2000}
      # Letsur AI Gateway Configuration
      LETSUR_AI_GATEWAY_BASE_URL: ${LETSUR_AI_GATEWAY_BASE_URL:-}
      LETSUR_AI_GATEWAY_API_KEY: ${LETSUR_AI_GATEWAY_API_KEY:-}
      LETSUR_AI_GATEWAY_MODEL: ${LETSUR_AI_GATEWAY_MODEL:-}
      LETSUR_AI_GATEWAY_MODEL_LIGHT: ${LETSUR_AI_GATEWAY_MODEL_LIGHT:-}
      LETSUR_AI_GATEWAY_MODEL_NORMAL: ${LETSUR_AI_GATEWAY_MODEL_NORMAL:-}
      LETSUR_AI_GATEWAY_MODEL_HEAVY: ${LETSUR_AI_GATEWAY_MODEL_HEAVY:-}
      LETSUR_AI_GATEWAY_X_TITLE: ${LETSUR_AI_GATEWAY_X_TITLE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-letsur}
      # Embedding (벡터 검색; 미설정 시 Letsur 게이트웨이 설정 재사용)
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MAX_DISTANCE: ${EMBEDDING_MAX_DISTANCE:-0.75}
      EMBEDDING_RETRIEVAL_ENABLED: ${EMBEDDING_RETRIEVAL_ENABLED:-true}
      # Hybrid retrieval (dense + lexical + exact) 튜닝
      RETRIEVAL_LEXICAL_ENABLED: ${RETRIEVAL_LEXICAL_ENABLED:-true}
      RETRIEVAL_DENSE_CANDIDATE_LIMIT: ${RETRIEVAL_DENSE_CANDIDATE_LIMIT:-20}
      RETRIEVAL_LEXICAL_CANDIDATE_LIMIT: ${RETRIEVAL_LEXICAL_CANDIDATE_LIMIT:-20}
      RETRIEVAL_STRONG_DISTANCE: ${RETRIEVAL_STRONG_DISTANCE:-0.55}
      RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-2}
      # OpenRouter Configuration (LLM_PROVIDER=openrouter)
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
      OPEN_ROUTER_BASE_URL: ${OPEN_ROUTER_BASE_URL:-}
      OPEN_ROUTER_MODEL_LIGHT: ${OPEN_ROUTER_MODEL_LIGHT:-}
      OPEN_ROUTER_MODEL_NORMAL: ${OPEN_ROUTER_MODEL_NORMAL:-}
      OPEN_ROUTER_MODEL_HEAVY: ${OPEN_ROUTER_MODEL_HEAVY:-}
      OPEN_ROUTER_X_TITLE: ${OPEN_ROUTER_X_TITLE:-}
      # Swagger API 문서 잠금
      SWAGGER_USER: ${SWAGGER_USER:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
